<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Śpiewnik Psie Pole</title>
  
  <!-- Fonty i style CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['Cinzel', 'serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Formatowanie akordów i tekstu */
    .song-line {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      margin-bottom: 0.25rem;
    }
    .pair {
      display: flex;
      flex-direction: column;
      margin-right: 0.35rem;
    }
    .chord {
      font-weight: 700;
      color: #2563eb; /* Blue-600 */
      font-size: 0.95rem;
      line-height: 1.1;
      user-select: none;
    }
    .dark .chord {
      color: #60a5fa; /* Blue-400 */
    }
    .lyric {
      font-size: 1.05rem;
      line-height: 1.2;
    }
    /* Chowanie widoków */
    .view-section {
      display: none;
    }
    .view-section.active {
      display: block;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen font-sans transition-colors duration-200">

  <!-- Pasek nawigacji / Nagłówek -->
  <header class="sticky top-0 z-30 bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-700 px-4 py-3 flex justify-between items-center shadow-sm">
    <h1 class="text-xl font-bold font-serif tracking-wide text-gray-800 dark:text-gray-100 cursor-pointer" onclick="showView('view-songs')">
      Śpiewnik Psie Pole
    </h1>
    
    <div class="flex items-center gap-2">
      <!-- Przycisk zmiana motywu -->
      <button id="btn-theme" onclick="toggleTheme()" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 transition">
        🌙
      </button>

      <!-- Panel Admina / Logowanie -->
      <div id="admin-controls">
        <button id="btn-login-prompt" onclick="promptLogin()" class="px-3 py-1.5 text-sm font-medium text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 rounded-lg hover:bg-amber-100 transition">
          🔒 Zaloguj
        </button>
        <button id="btn-logout" onclick="logout()" class="hidden px-3 py-1.5 text-sm font-medium text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 rounded-lg hover:bg-red-100 transition">
          🔓 Wyjdź
        </button>
      </div>
    </div>
  </header>

  <!-- Główny kontener -->
  <main class="max-w-2xl mx-auto p-4 pb-24">

    <!-- WIDOK 1: LISTA UTWORÓW -->
    <section id="view-songs" class="view-section active space-y-4">
      <!-- Wyszukiwarka i filtry -->
      <div class="space-y-2">
        <input type="text" id="search-input" placeholder="Szukaj utworu lub tekstu..." oninput="filterSongs()" 
               class="w-full px-4 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 focus:ring-2 focus:ring-amber-500 outline-none transition">
        
        <div class="flex gap-2 overflow-x-auto pb-1 text-sm scrollbar-none" id="category-filters">
          <button onclick="setCategory('Wszystkie')" class="cat-btn active bg-amber-600 text-white px-3 py-1 rounded-full font-medium whitespace-nowrap">Wszystkie</button>
          <button onclick="setCategory('Uwielbienie')" class="cat-btn bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 px-3 py-1 rounded-full font-medium whitespace-nowrap">Uwielbienie</button>
          <button onclick="setCategory('Pieśni')" class="cat-btn bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 px-3 py-1 rounded-full font-medium whitespace-nowrap">Pieśni</button>
          <button onclick="setCategory('Z pokazywaniem')" class="cat-btn bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 px-3 py-1 rounded-full font-medium whitespace-nowrap">🙌 Pokazywanie</button>
        </div>
      </div>

      <!-- Przycisk dodawania (widoczny tylko dla admina) -->
      <button id="btn-add-song" onclick="openForm()" class="hidden w-full py-3 bg-amber-600 hover:bg-amber-700 text-white font-semibold rounded-xl shadow-md transition flex items-center justify-center gap-2">
        <span>➕</span> Dodaj nowy utwór
      </button>

      <!-- Lista pieśni -->
      <div id="songs-list" class="space-y-2">
        <div class="text-center py-8 text-gray-500">Ładowanie śpiewnika...</div>
      </div>
    </section>


    <!-- WIDOK 2: PODGLĄD UTWORU -->
    <section id="view-details" class="view-section space-y-4">
      <div class="flex justify-between items-center border-b border-gray-200 dark:border-gray-700 pb-3">
        <button onclick="showView('view-songs')" class="px-3 py-1.5 bg-gray-200 dark:bg-gray-700 rounded-lg text-sm font-medium hover:bg-gray-300 dark:hover:bg-gray-600 transition">
          ← Powrót
        </button>

        <div id="admin-edit-tools" class="hidden flex gap-2">
          <button onclick="editCurrentSong()" class="px-3 py-1.5 bg-amber-600 text-white rounded-lg text-sm font-medium hover:bg-amber-700 transition">
            ✏️ Edytuj
          </button>
        </div>
      </div>

      <!-- Nagłówek utworu -->
      <div>
        <div class="flex items-center gap-2">
          <h2 id="song-title" class="text-2xl font-bold font-serif text-gray-900 dark:text-white"></h2>
          <span id="song-badge-actions" class="hidden text-lg" title="Pieśń z pokazywaniem">🙌</span>
        </div>
        <p id="song-category" class="text-sm font-medium text-amber-600 dark:text-amber-400 mt-0.5"></p>
      </div>

      <!-- Pasek narzędzi (Transpozycja + Link Audio) -->
      <div class="flex flex-wrap gap-2 items-center justify-between bg-gray-100 dark:bg-gray-800 p-2.5 rounded-xl border border-gray-200 dark:border-gray-700">
        <!-- Transpozycja -->
        <div class="flex items-center gap-1.5 text-sm font-semibold">
          <span class="text-gray-500 dark:text-gray-400 mr-1">Tonacja:</span>
          <button onclick="transpose(-1)" class="w-8 h-8 rounded-lg bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 hover:bg-gray-50 active:scale-95 transition">-</button>
          <span id="transpose-val" class="w-6 text-center">0</span>
          <button onclick="transpose(1)" class="w-8 h-8 rounded-lg bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 hover:bg-gray-50 active:scale-95 transition">+</button>
          <button onclick="resetTranspose()" class="text-xs text-gray-500 underline ml-1">Reset</button>
        </div>

        <!-- Odtwarzacz / Link do nagrania -->
        <div id="audio-container" class="hidden">
          <a id="audio-link" target="_blank" rel="noopener noreferrer" class="flex items-center gap-1.5 text-sm font-medium text-amber-600 dark:text-amber-400 hover:underline bg-amber-50 dark:bg-amber-950/40 px-3 py-1.5 rounded-lg border border-amber-200 dark:border-amber-800">
            ▶️ Posłuchaj nagrania
          </a>
        </div>
      </div>

      <!-- Treść utworu -->
      <div id="song-content" class="bg-white dark:bg-gray-800 p-4 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm overflow-x-auto leading-relaxed">
      </div>
    </section>


    <!-- WIDOK 3: FORMULARZ EDYCJI / DODAWANIA -->
    <section id="view-form" class="view-section space-y-4">
      <div class="flex justify-between items-center border-b border-gray-200 dark:border-gray-700 pb-3">
        <button onclick="showView('view-songs')" class="px-3 py-1.5 bg-gray-200 dark:bg-gray-700 rounded-lg text-sm font-medium">Anuluj</button>
        <h2 id="form-heading" class="text-lg font-bold font-serif">Edytuj Utwór</h2>
        <div class="w-12"></div>
      </div>

      <form id="song-form" onsubmit="event.preventDefault(); saveSong();" class="space-y-3">
        <input type="hidden" id="form-id">

        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Tytuł utworu *</label>
          <input type="text" id="form-title" required class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 outline-none focus:ring-2 focus:ring-amber-500">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Kategoria</label>
            <input type="text" id="form-category" placeholder="Uwielbienie" class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 outline-none focus:ring-2 focus:ring-amber-500">
          </div>
          <div class="flex items-center pt-5">
            <label class="flex items-center gap-2 cursor-pointer text-sm font-medium">
              <input type="checkbox" id="form-has-actions" class="w-4 h-4 rounded text-amber-600 focus:ring-amber-500">
              Z pokazywaniem 🙌
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Link do nagrania (YouTube / MP3 / Drive)</label>
          <input type="url" id="form-audio-url" placeholder="https://..." class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 outline-none focus:ring-2 focus:ring-amber-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Tekst utworu *</label>
          <textarea id="form-lyrics" rows="6" required placeholder="Wpisz tekst pieśni..." class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 outline-none focus:ring-2 focus:ring-amber-500 font-mono text-sm"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Akordy (jeden wiersz = zwrotka, np. D A G D)</label>
          <textarea id="form-chords" rows="4" placeholder="D A G D&#10;G D A D" class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 outline-none focus:ring-2 focus:ring-amber-500 font-mono text-sm"></textarea>
        </div>

        <div class="pt-2 space-y-2">
          <button type="submit" class="w-full py-3 bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 font-bold rounded-xl shadow hover:opacity-90 transition">
            💾 Zapisz w chmurze
          </button>
          
          <button type="button" id="btn-delete-song" onclick="deleteCurrentSong()" class="hidden w-full py-2.5 bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 font-semibold border border-red-200 dark:border-red-800 rounded-xl hover:bg-red-100 transition">
            🗑️ Usuń utwór
          </button>
        </div>
      </form>
    </section>

  </main>

  <!-- FIREBASE SDK & SKRYPT APLIKACJI -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Konfiguracja Firebase (zastąp własnymi kluczami jeśli potrzebne)
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKey_ReplaceWithYourOwnIfRequired",
      authDomain: "spiewnik-rose.firebaseapp.com",
      projectId: "spiewnik-rose",
      storageBucket: "spiewnik-rose.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    let db = null;
    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    } catch (e) {
      console.warn("Brak połączenia z Firebase – tryb demo/lokalny.", e);
    }

    // Stan Aplikacji
    let songs = [];
    let currentSong = null;
    let currentCategory = 'Wszystkie';
    let transposeSteps = 0;
    let isAdmin = localStorage.getItem('spiewnik_admin') === 'true';

    // Tonacje do transpozycji
    const scale = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "H"];
    const scaleFlat = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "B", "H"];

    // Inicjalizacja motywu
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }

    window.toggleTheme = function() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    };

    // Zarządzanie logowaniem Admina
    window.promptLogin = function() {
      const pass = prompt("Podaj hasło administratora:");
      if (pass === "psiepole") { // Proste hasło dostępowe
        isAdmin = true;
        localStorage.setItem('spiewnik_admin', 'true');
        updateAdminUI();
        alert("Zalogowano jako Administrator!");
      } else if (pass) {
        alert("Niepoprawne hasło!");
      }
    };

    window.logout = function() {
      isAdmin = false;
      localStorage.removeItem('spiewnik_admin');
      updateAdminUI();
    };

    function updateAdminUI() {
      document.getElementById('btn-login-prompt').classList.toggle('hidden', isAdmin);
      document.getElementById('btn-logout').classList.toggle('hidden', !isAdmin);
      document.getElementById('btn-add-song').classList.toggle('hidden', !isAdmin);
      document.getElementById('admin-edit-tools').classList.toggle('hidden', !isAdmin);
    }

    // Nawigacja widoków
    window.showView = function(viewId) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      window.scrollTo(0, 0);
    };

    // Pobieranie danych z Firestore
    if (db) {
      onSnapshot(collection(db, "songs"), (snapshot) => {
        songs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        // Sortowanie alfabetyczne
        songs.sort((a, b) => a.title.localeCompare(b.title, 'pl'));
        renderSongsList();
      }, (err) => {
        console.error("Błąd pobierania z bazy:", err);
      });
    }

    // Filtrowanie i renderowanie listy
    window.setCategory = function(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        const active = btn.textContent.includes(cat) || (cat === 'Wszystkie' && btn.textContent === 'Wszystkie');
        btn.className = active 
          ? "cat-btn active bg-amber-600 text-white px-3 py-1 rounded-full font-medium whitespace-nowrap"
          : "cat-btn bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 px-3 py-1 rounded-full font-medium whitespace-nowrap";
      });
      filterSongs();
    };

    window.filterSongs = function() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = songs.filter(s => {
        const matchesCat = currentCategory === 'Wszystkie' 
          || (currentCategory === 'Z pokazywaniem' ? s.hasActions : s.category === currentCategory);
        const matchesSearch = s.title.toLowerCase().includes(query) || (s.lyrics && s.lyrics.toLowerCase().includes(query));
        return matchesCat && matchesSearch;
      });
      renderSongsList(filtered);
    };

    function renderSongsList(list = songs) {
      const container = document.getElementById('songs-list');
      if (list.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-gray-500">Brak utworów spełniających kryteria.</div>`;
        return;
      }

      container.innerHTML = list.map(s => `
        <div onclick="openSong('${s.id}')" class="p-3.5 bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm hover:border-amber-500 cursor-pointer transition flex justify-between items-center">
          <div>
            <div class="font-bold text-gray-900 dark:text-gray-100 flex items-center gap-1.5">
              ${escapeHtml(s.title)}
              ${s.hasActions ? '<span>🙌</span>' : ''}
            </div>
            <div class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">${escapeHtml(s.category || 'Uwielbienie')}</div>
          </div>
          ${s.audioUrl ? '<span class="text-xs bg-amber-100 dark:bg-amber-900/40 text-amber-700 dark:text-amber-300 px-2 py-0.5 rounded">🎵 Audio</span>' : ''}
        </div>
      `).join('');
    }

    // Podgląd wybranego utworu
    window.openSong = function(id) {
      currentSong = songs.find(s => s.id === id);
      if (!currentSong) return;

      transposeSteps = 0;
      document.getElementById('transpose-val').textContent = "0";

      document.getElementById('song-title').textContent = currentSong.title;
      document.getElementById('song-category').textContent = currentSong.category || "Uwielbienie";
      document.getElementById('song-badge-actions').classList.toggle('hidden', !currentSong.hasActions);

      // Obsługa nagrania Audio
      const audioContainer = document.getElementById('audio-container');
      if (currentSong.audioUrl) {
        audioContainer.classList.remove('hidden');
        document.getElementById('audio-link').href = currentSong.audioUrl;
      } else {
        audioContainer.classList.add('hidden');
      }

      renderFormattedSong();
      showView('view-details');
    };

    // Renderowanie tekstu i akordów + Transpozycja
    function renderFormattedSong() {
      if (!currentSong) return;
      const container = document.getElementById('song-content');
      
      const lyricsLines = (currentSong.lyrics || "").split('\n');
      const chordsLines = (currentSong.chords || "").split('\n');

      let html = '';

      lyricsLines.forEach((line, idx) => {
        if (!line.trim()) {
          html += `<div class="h-4"></div>`;
          return;
        }

        const chordLine = chordsLines[idx] || '';
        const transposedChords = transposeLine(chordLine, transposeSteps);

        if (transposedChords.trim()) {
          // Renderowanie wiersza z akordami nad tekstem
          html += `<div class="song-line">`;
          const words = line.split(' ');
          const chords = transposedChords.split(/\s+/).filter(Boolean);

          words.forEach((word, wIdx) => {
            const chord = chords[wIdx] || '';
            html += `
              <div class="pair">
                <span class="chord">${escapeHtml(chord)}</span>
                <span class="lyric">${escapeHtml(word)}&nbsp;</span>
              </div>
            `;
          });
          html += `</div>`;
        } else {
          // Sam tekst
          html += `<div class="lyric mb-1">${escapeHtml(line)}</div>`;
        }
      });

      container.innerHTML = html;
    }

    // Algorytm transpozycji akordów
    function transposeLine(line, steps) {
      if (!steps || !line) return line;
      return line.replace(/([A-H][b#]?)(m|[0-9]|maj7|sus[24]|add9)?/g, (match, root, ext) => {
        let idx = scale.indexOf(root);
        if (idx === -1) idx = scaleFlat.indexOf(root);
        if (idx === -1) return match;

        let newIdx = (idx + steps) % 12;
        if (newIdx < 0) newIdx += 12;

        return scale[newIdx] + (ext || '');
      });
    }

    window.transpose = function(delta) {
      transposeSteps += delta;
      document.getElementById('transpose-val').textContent = (transposeSteps > 0 ? "+" : "") + transposeSteps;
      renderFormattedSong();
    };

    window.resetTranspose = function() {
      transposeSteps = 0;
      document.getElementById('transpose-val').textContent = "0";
      renderFormattedSong();
    };

    // Formularz edycji i dodawania (ADMIN)
    window.openForm = function(song = null) {
      if (!isAdmin) return;
      document.getElementById('form-heading').textContent = song ? "Edytuj Utwór" : "Dodaj Utwór";
      document.getElementById('form-id').value = song ? song.id : '';
      document.getElementById('form-title').value = song ? song.title : '';
      document.getElementById('form-category').value = song ? song.category : 'Uwielbienie';
      document.getElementById('form-has-actions').checked = song ? !!song.hasActions : false;
      document.getElementById('form-audio-url').value = song ? (song.audioUrl || '') : '';
      document.getElementById('form-lyrics').value = song ? song.lyrics : '';
      document.getElementById('form-chords').value = song ? (song.chords || '') : '';

      document.getElementById('btn-delete-song').classList.toggle('hidden', !song);
      showView('view-form');
    };

    window.editCurrentSong = function() {
      openForm(currentSong);
    };

    // ZAPIS W CHMURZE (POPRATWIONA FUNKCJA)
    window.saveSong = async function() {
      if (!isAdmin) return;
      const id = document.getElementById('form-id').value;
      const title = document.getElementById('form-title').value.trim();
      const category = document.getElementById('form-category').value.trim() || "Uwielbienie";
      const hasActions = document.getElementById('form-has-actions').checked;
      const audioUrl = document.getElementById('form-audio-url').value.trim();
      const lyrics = document.getElementById('form-lyrics').value.trim();
      const chords = document.getElementById('form-chords').value.trim();

      if (!title || !lyrics) return alert("Wypełnij tytuł oraz tekst utworu!");

      const songData = { title, category, hasActions, audioUrl, lyrics, chords };

      try {
        if (id) {
          // Poprawione wywołanie doc(...) w Firestore
          if (db) await updateDoc(doc(db, "songs", id), songData);
        } else {
          if (db) await addDoc(collection(db, "songs"), songData);
        }
        showView('view-songs');
      } catch (e) {
        console.error("Błąd zapisu do chmury:", e);
        alert("Błąd zapisu w chmurze!");
      }
    };

    window.deleteCurrentSong = async function() {
      const id = document.getElementById('form-id').value;
      if (!id || !isAdmin) return;

      if (confirm("Czy na pewno chcesz usunąć ten utwór?")) {
        try {
          if (db) await deleteDoc(doc(db, "songs", id));
          showView('view-songs');
        } catch (e) {
          console.error("Błąd usuwania:", e);
          alert("Błąd podczas usuwania utworu.");
        }
      }
    };

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Inicjalizacja przycisku logowania
    updateAdminUI();
  </script>
</body>
</html>
