<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Nawigacji</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #0b132b; color: #fff; }
    .hidden { display: none !important; }
    .btn { padding: 12px; margin: 8px 0; display: block; width: 100%; background: #48cae4; border: none; font-weight: bold; cursor: pointer; }
    .card { background: #1c2541; padding: 15px; border-radius: 8px; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- Ekran 1: Menu główne -->
  <div id="view-home">
    <h1>Menu Główne</h1>
    <button class="btn" id="btn-go-songs">📖 Przeglądaj Śpiewnik</button>
    <button class="btn" id="btn-go-repertuar">📌 Bieżący Repertuar</button>
  </div>

  <!-- Ekran 2: Śpiewnik -->
  <div id="view-songs" class="hidden">
    <h1>Śpiewnik (Lista)</h1>
    <button class="btn" id="btn-back-1" style="background: #8d99ae;">⬅️ Powrót do menu</button>
    <div class="card">Tu będzie lista pieśni...</div>
  </div>

  <!-- Ekran 3: Repertuar -->
  <div id="view-repertuar" class="hidden">
    <h1>Bieżący Repertuar</h1>
    <button class="btn" id="btn-back-2" style="background: #8d99ae;">⬅️ Powrót do menu</button>
    <div class="card">Tu będą wybrane pieśni...</div>
  </div>

  <script type="module">
    // Funkcja do ukrywania wszystkich widoków i pokazywania wybranego
    function goToView(viewId) {
      document.getElementById('view-home').classList.add('hidden');
      document.getElementById('view-songs').classList.add('hidden');
      document.getElementById('view-repertuar').classList.add('hidden');

      document.getElementById(viewId).classList.remove('hidden');
    }

    // Podpinamy zdarzenia pod przyciski
    document.getElementById('btn-go-songs').addEventListener('click', () => {
      goToView('view-songs');
    });

    document.getElementById('btn-go-repertuar').addEventListener('click', () => {
      goToView('view-repertuar');
    });

    document.getElementById('btn-back-1').addEventListener('click', () => {
      goToView('view-home');
    });

    document.getElementById('btn-back-2').addEventListener('click', () => {
      goToView('view-home');
    });
  </script>
</body>
</html>
