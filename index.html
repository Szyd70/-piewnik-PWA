
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = { projectId: "spiewnik-psie-pole" };
  let db = null;

  try {
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
  } catch(e) {
    console.error("Błąd inicjalizacji Firebase:", e);
  }

  let allSongs = [];
  let archivedRepertuars = [];
  let repertuarIds = JSON.parse(localStorage.getItem('repertuar_songs') || '[]');
  let previousView = 'home-view';
  let currentSongId = null;
  let activeCategory = 'Wszystkie';

  let loadedMp3Data = null;
  let loadedPdfData = null;

  let scrollInterval = null;
  let isScrolling = false;

  const ADMIN_PIN = "1234";

  const chromaticScale = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  const flatScale = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];

  // Nawigacja widoków podpięta globalnie
  window.showView = function(viewId) {
    stopAutoScroll();
    document.querySelectorAll('.container > div').forEach(div => div.classList.add('hidden'));
    const target = document.getElementById(viewId);
    if (target) {
      target.classList.remove('hidden');
    }
  };

  async function loadSongs() {
    if (!db) return;
    try {
      const querySnapshot = await getDocs(collection(db, "songs"));
      allSongs = [];
      querySnapshot.forEach((d) => {
        allSongs.push({ id: d.id, ...d.data() });
      });

      const archiveSnapshot = await getDocs(collection(db, "archives"));
      archivedRepertuars = [];
      archiveSnapshot.forEach((d) => {
        archivedRepertuars.push({ id: d.id, ...d.data() });
      });

      renderAll();
    } catch (e) {
      console.error("Błąd podczas pobierania danych:", e);
      const songListEl = document.getElementById('all-songs-list');
      if (songListEl) songListEl.innerText = "Błąd połączenia z bazą danych Firebase.";
    }
  }

  function getUniqueCategories() {
    const cats = new Set(['Uwielbienie']);
    allSongs.forEach(s => {
      if (s.category && s.category.trim() !== '') {
        cats.add(s.category.trim());
      }
    });
    return Array.from(cats);
  }

  function renderAll() {
    renderCategoryChips();
    renderDatalist();
    renderSongsList();
    renderRepertuar();
    renderArchives();
  }

  function renderCategoryChips() {
    const container = document.getElementById('categories-bar');
    if (!container) return;
    container.innerHTML = '';

    const categories = ['Wszystkie', ...getUniqueCategories()];

    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = `cat-chip ${activeCategory === cat ? 'active' : ''}`;
      btn.innerText = cat;
      btn.onclick = () => {
        activeCategory = cat;
        renderCategoryChips();
        renderSongsList();
      };
      container.appendChild(btn);
    });
  }

  function renderDatalist() {
    const datalist = document.getElementById('categories-datalist');
    if (!datalist) return;
    datalist.innerHTML = '';
    getUniqueCategories().forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      datalist.appendChild(opt);
    });
  }

  function renderSongsList() {
    const container = document.getElementById('all-songs-list');
    if (!container) return;
    container.innerHTML = '';

    let filtered = allSongs;
    if (activeCategory !== 'Wszystkie') {
      filtered = allSongs.filter(s => (s.category || 'Uwielbienie') === activeCategory);
    }

    if (filtered.length === 0) {
      container.innerHTML = '<p style="color: var(--text-sub);">Brak utworów w tej kategorii.</p>';
      return;
    }

    filtered.forEach(song => {
      container.appendChild(createSongRow(song));
    });
  }

  function renderRepertuar() {
    const container = document.getElementById('repertuar-list');
    if (!container) return;
    container.innerHTML = '';

    const repertuarSongs = allSongs.filter(s => repertuarIds.includes(s.id));

    if (repertuarSongs.length === 0) {
      container.innerHTML = '<p style="color: var(--text-sub);">Repertuar jest pusty. Dodaj pieśni za pomocą plusika (+).</p>';
      return;
    }

    repertuarSongs.forEach(song => {
      container.appendChild(createSongRow(song));
    });
  }

  function renderArchives() {
    const container = document.getElementById('archive-list');
    if (!container) return;
    container.innerHTML = '';

    if (archivedRepertuars.length === 0) {
      container.innerHTML = '<p style="color: var(--text-sub);">Brak zapisanych zestawów w archiwum.</p>';
      return;
    }

    archivedRepertuars.forEach(arch => {
      const div = document.createElement('div');
      div.className = 'archive-item';
      div.innerHTML = `
        <div>
          <strong style="color: var(--primary); font-size: 1rem;">${arch.name}</strong>
          <div style="font-size: 0.8rem; color: var(--text-sub);">Liczba pieśni: ${arch.songIds ? arch.songIds.length : 0}</div>
        </div>
        <div>
          <button class="btn btn-secondary btn-small" onclick="window.loadArchiveToRepertuar('${arch.id}')">📂 Wczytaj</button>
          <button class="btn btn-danger btn-small" onclick="window.deleteArchive('${arch.id}')">🗑️</button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  function createSongRow(song) {
    const div = document.createElement('div');
    div.className = 'song-item';
    const isInRepertuar = repertuarIds.includes(song.id);

    div.innerHTML = `
      <button class="song-title-btn" onclick="window.openSong('${song.id}')">
        ${song.title} <span class="song-category">${song.category || 'Uwielbienie'}</span>
      </button>
      <button class="btn-add-repertuar" onclick="window.toggleRepertuar('${song.id}')">
        ${isInRepertuar ? '➖' : '➕'}
      </button>
    `;
    return div;
  }

  window.openSong = function(id) {
    const song = allSongs.find(s => s.id === id);
    if (!song) return;

    currentSongId = id;
    if (!document.getElementById('songs-list-view').classList.contains('hidden')) {
      previousView = 'songs-list-view';
    } else if (!document.getElementById('repertuar-view').classList.contains('hidden')) {
      previousView = 'repertuar-view';
    } else {
      previousView = 'home-view';
    }

    document.getElementById('view-song-title').innerText = song.title;
    document.getElementById('view-song-category').innerText = song.category || 'Uwielbienie';
    document.getElementById('view-song-lyrics').innerText = song.lyrics || song.text || 'Brak tekstu.';
    
    const chordsEl = document.getElementById('view-song-chords');
    chordsEl.innerText = song.chords || 'Brak akordów.';
    chordsEl.style.display = 'none';

    const mediaContainer = document.getElementById('view-song-media');
    mediaContainer.innerHTML = '';
    if (song.mp3) mediaContainer.innerHTML += `<a href="${song.mp3}" download="${song.title}.mp3" target="_blank" class="media-btn">🎵 Pobierz / Otwórz MP3</a>`;
    if (song.pdf) mediaContainer.innerHTML += `<a href="${song.pdf}" download="${song.title}.pdf" target="_blank" class="media-btn">📄 Otwórz Nuty / PDF</a>`;

    window.showView('single-song-view');
  };

  window.goBackFromSong = function() {
    window.showView(previousView);
  };

  window.toggleChords = function() {
    const el = document.getElementById('view-song-chords');
    el.style.display = (el.style.display === 'block') ? 'none' : 'block';
  };

  window.changeFontSize = function(deltaPixel) {
    const lyricsEl = document.getElementById('view-song-lyrics');
    const style = window.getComputedStyle(lyricsEl, null).getPropertyValue('font-size');
    const currentSize = parseFloat(style);
    lyricsEl.style.fontSize = (currentSize + deltaPixel) + 'px';
  };

  function transposeChord(chord, steps) {
    return chord.replace(/[A-G][#b]?/g, (match) => {
      let index = chromaticScale.indexOf(match);
      if (index === -1) index = flatScale.indexOf(match);
      if (index === -1) return match;
      let newIndex = (index + steps) % 12;
      if (newIndex < 0) newIndex += 12;
      return chromaticScale[newIndex];
    });
  }

  window.transpose = function(steps) {
    const chordsEl = document.getElementById('view-song-chords');
    if (chordsEl.innerText && chordsEl.innerText !== 'Brak akordów.') {
      chordsEl.innerText = transposeChord(chordsEl.innerText, steps);
    }
  };

  window.toggleAutoScroll = function() {
    if (isScrolling) {
      stopAutoScroll();
    } else {
      startAutoScroll();
    }
  };

  function startAutoScroll() {
    isScrolling = true;
    const btn = document.getElementById('btn-scroll');
    if (btn) {
      btn.innerText = "⏸️ Stop";
      btn.style.backgroundColor = "var(--accent)";
    }

    scrollInterval = setInterval(() => {
      const speed = parseInt(document.getElementById('scroll-speed').value, 10);
      window.scrollBy(0, speed);
      
      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight) {
        stopAutoScroll();
      }
    }, 50);
  }

  function stopAutoScroll() {
    isScrolling = false;
    if (scrollInterval) clearInterval(scrollInterval);
    const btn = document.getElementById('btn-scroll');
    if (btn) {
      btn.innerText = "📜 Start Auto";
      btn.style.backgroundColor = "transparent";
    }
  }

  window.toggleRepertuar = function(id) {
    if (repertuarIds.includes(id)) {
      repertuarIds = repertuarIds.filter(item => item !== id);
    } else {
      repertuarIds.push(id);
    }
    localStorage.setItem('repertuar_songs', JSON.stringify(repertuarIds));
    renderAll();
  };

  window.saveRepertuarToArchive = async function() {
    const nameInput = document.getElementById('archive-name-input');
    const name = nameInput.value.trim();

    if (!name) {
      alert("Wpisz nazwę dla zapisywanego repertuaru!");
      return;
    }

    if (repertuarIds.length === 0) {
      alert("Repertuar jest pusty. Dodaj najpierw utwory!");
      return;
    }

    try {
      await addDoc(collection(db, "archives"), {
        name: name,
        songIds: repertuarIds,
        createdAt: new Date()
      });
      alert("Zapisano repertuar w archiwum!");
      nameInput.value = "";
      loadSongs();
    } catch (e) {
      alert("Błąd zapisu archiwum: " + e.message);
    }
  };

  window.loadArchiveToRepertuar = function(archiveId) {
    const archive = archivedRepertuars.find(a => a.id === archiveId);
    if (!archive) return;

    if (confirm(`Czy chcesz wczytać zestaw "${archive.name}" jako bieżący repertuar?`)) {
      repertuarIds = [...archive.songIds];
      localStorage.setItem('repertuar_songs', JSON.stringify(repertuarIds));
      renderAll();
      window.showView('repertuar-view');
    }
  };

  window.deleteArchive = async function(archiveId) {
    const pin = prompt("Wpisz PIN administratora:");
    if (pin !== ADMIN_PIN) {
      alert("Niepoprawny PIN!");
      return;
    }

    if (confirm("Czy na pewno chcesz usunąć ten zestaw z archiwum?")) {
      try {
        await deleteDoc(doc(db, "archives", archiveId));
        alert("Usunięto z archiwum.");
        loadSongs();
      } catch (e) {
        alert("Błąd usuwania archiwum: " + e.message);
      }
    }
  };

  window.filterSongs = function() {
    const query = document.getElementById('search-input').value.toLowerCase();
    const rows = document.querySelectorAll('#all-songs-list .song-item');
    rows.forEach(row => {
      row.style.display = row.innerText.toLowerCase().includes(query) ? 'flex' : 'none';
    });
  };

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  }

  window.openAddForm = function() {
    document.getElementById('form-title').innerText = "Dodaj Utwór";
    document.getElementById('song-id').value = "";
    document.getElementById('song-title').value = "";
    document.getElementById('song-category').value = "Uwielbienie";
    document.getElementById('song-lyrics').value = "";
    document.getElementById('song-chords').value = "";
    document.getElementById('song-mp3-file').value = "";
    document.getElementById('song-pdf-file').value = "";
    loadedMp3Data = null;
    loadedPdfData = null;
    document.getElementById('btn-delete-song').classList.add('hidden');
    window.showView('add-view');
  };

  window.editCurrentSong = function() {
    const pin = prompt("Wpisz PIN administratora:");
    if (pin !== ADMIN_PIN) {
      alert("Niepoprawny PIN!");
      return;
    }

    const song = allSongs.find(s => s.id === currentSongId);
    if (!song) return;

    document.getElementById('form-title').innerText = "Edytuj Utwór";
    document.getElementById('song-id').value = song.id;
    document.getElementById('song-title').value = song.title;
    document.getElementById('song-category').value = song.category || "Uwielbienie";
    document.getElementById('song-lyrics').value = song.lyrics || song.text || "";
    document.getElementById('song-chords').value = song.chords || "";
    document.getElementById('song-mp3-file').value = "";
    document.getElementById('song-pdf-file').value = "";
    loadedMp3Data = song.mp3 || null;
    loadedPdfData = song.pdf || null;
    
    document.getElementById('btn-delete-song').classList.remove('hidden');
    window.showView('add-view');
  };

  window.saveSong = async function() {
    const id = document.getElementById('song-id').value;
    const title = document.getElementById('song-title').value.trim();
    const category = document.getElementById('song-category').value.trim() || "Uwielbienie";
    const lyrics = document.getElementById('song-lyrics').value.trim();
    const chords = document.getElementById('song-chords').value.trim();

    if (!title || !lyrics) {
      alert("Uzupełnij tytuł i tekst utworu!");
      return;
    }

    const mp3FileInput = document.getElementById('song-mp3-file');
    const pdfFileInput = document.getElementById('song-pdf-file');

    let mp3 = loadedMp3Data;
    let pdf = loadedPdfData;

    if (mp3FileInput.files.length > 0) {
      mp3 = await fileToBase64(mp3FileInput.files[0]);
    }
    if (pdfFileInput.files.length > 0) {
      pdf = await fileToBase64(pdfFileInput.files[0]);
    }

    try {
      if (id) {
        await updateDoc(doc(db, "songs", id), { title, category, lyrics, chords, mp3, pdf });
        alert("Zaktualizowano utwór!");
      } else {
        await addDoc(collection(db, "songs"), { title, category, lyrics, chords, mp3, pdf, createdAt: new Date() });
        alert("Dodano nowy utwór!");
      }
      window.showView('home-view');
      loadSongs();
    } catch (e) {
      alert("Błąd zapisu: " + e.message);
    }
  };

  window.deleteCurrentSong = async function() {
    const id = document.getElementById('song-id').value;
    if (!id) return;

    if (confirm("Czy na pewno chcesz usunąć ten utwór z bazy?")) {
      try {
        await deleteDoc(doc(db, "songs", id));
        alert("Usunięto utwór.");
        window.showView('home-view');
        loadSongs();
      } catch (e) {
        alert("Błąd usuwania: " + e.message);
      }
    }
  };

  // Bezpośrednie przypisanie zdarzeń do przycisków w kodzie
  function attachButtonEvents() {
    const btnRepertuar = document.getElementById('btn-nav-repertuar');
    const btnArchive = document.getElementById('btn-nav-archive');
    const btnSongs = document.getElementById('btn-nav-songs');
    const btnAdd = document.getElementById('btn-nav-add');

    if (btnRepertuar) btnRepertuar.onclick = () => window.showView('repertuar-view');
    if (btnArchive) btnArchive.onclick = () => window.showView('archive-view');
    if (btnSongs) btnSongs.onclick = () => window.showView('songs-list-view');
    if (btnAdd) btnAdd.onclick = () => window.openAddForm();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attachButtonEvents);
  } else {
    attachButtonEvents();
  }

  loadSongs();
</script>
