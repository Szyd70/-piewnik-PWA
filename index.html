<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Śpiewnik Psie Pole</title>
  <style>
    :root {
      --bg: #0b132b;
      --card-bg: #1c2541;
      --primary: #48cae4;
      --accent: #ff0054;
      --text: #ffffff;
      --text-sub: #8d99ae;
      --border: #3a506b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 500px; }
    h1 { color: var(--primary); text-align: center; margin-bottom: 20px; font-size: 1.8rem; }
    .btn { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid var(--primary); background-color: var(--card-bg); color: var(--primary); border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; }
    .btn-filled { background-color: var(--primary); color: var(--bg); }
    .btn-secondary { background-color: transparent; border-color: var(--border); color: var(--text); }
    .btn-danger { border-color: var(--accent); color: var(--accent); }
    .btn-small { width: auto; padding: 6px 12px; font-size: 0.9rem; margin-bottom: 0; }
    .hidden { display: none !important; }
    .song-item, .archive-item { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .song-title-btn { background: none; border: none; color: var(--text); font-size: 1rem; font-weight: bold; text-align: left; flex-grow: 1; cursor: pointer; }
    .song-category { font-size: 0.75rem; color: var(--primary); display: block; margin-top: 2px; }
    .input-field { width: 100%; padding: 12px; margin-bottom: 12px; background-color: var(--card-bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; font-size: 1rem; }
    textarea.input-field { height: 120px; resize: vertical; }
    .nav-bar { display: flex; justify-content: space-between; margin-bottom: 15px; }
    .cat-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
    .cat-chip { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-sub); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; white-space: nowrap; cursor: pointer; }
    .cat-chip.active { background: var(--primary); color: var(--bg); font-weight: bold; }
    .song-lyrics { white-space: pre-wrap; font-size: 1.1rem; line-height: 1.6; margin-top: 15px; }
    .song-chords { white-space: pre-wrap; font-family: monospace; font-size: 1.1rem; color: var(--primary); background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin-top: 10px; display: none; }
    .controls-panel { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
  </style>
</head>
<body>

<div class="container">
  <!-- GŁÓWNY -->
  <div id="view-home">
    <h1>ŚPIEWNIK PSIE POLE</h1>
    <button class="btn btn-filled" onclick="showView('view-repertuar')">📌 Repertuar</button>
    <button class="btn btn-filled" onclick="showView('view-archive')">📁 Archiwum</button>
    <button class="btn btn-filled" onclick="showView('view-songs')">📖 Przeglądaj Śpiewnik</button>
    <button class="btn" onclick="openAddForm()">➕ Dodaj Utwór 🔒</button>
  </div>

  <!-- ŚPIEWNIK -->
  <div id="view-songs" class="hidden">
    <div class="nav-bar"><button class="btn btn-secondary btn-small" onclick="showView('view-home')">⬅️</button><h2>Śpiewnik</h2></div>
    <input type="text" id="search-input" class="input-field" placeholder="🔎 Szukaj..." oninput="filterSongs()">
    <div class="cat-bar" id="categories-bar"></div>
    <div id="all-songs-list"></div>
  </div>

  <!-- REPERTUAR -->
  <div id="view-repertuar" class="hidden">
    <div class="nav-bar"><button class="btn btn-secondary btn-small" onclick="showView('view-home')">⬅️</button><h2>Repertuar</h2></div>
    <div id="repertuar-list"></div>
    <input type="text" id="archive-name-input" class="input-field" placeholder="Nazwa zestawu...">
    <button class="btn btn-filled" onclick="saveRepertuarToArchive()">💾 Zapisz do Archiwum</button>
  </div>

  <!-- ARCHIWUM -->
  <div id="view-archive" class="hidden">
    <div class="nav-bar"><button class="btn btn-secondary btn-small" onclick="showView('view-home')">⬅️</button><h2>Archiwum</h2></div>
    <div id="archive-list"></div>
  </div>

  <!-- JEDEN UTWÓR -->
  <div id="view-single" class="hidden">
    <div class="nav-bar">
      <button class="btn btn-secondary btn-small" onclick="showView(previousView)">⬅️ Powrót</button>
      <button class="btn btn-secondary btn-small" onclick="editCurrentSong()">✏️ Edytuj</button>
    </div>
    <h2 id="view-title"></h2>
    
    <!-- ODTWARZACZ AUDIO -->
    <div id="view-audio-container" class="hidden" style="margin-top: 15px; background: #1c2541; padding: 10px; border-radius: 8px;">
      <audio id="view-audio-player" controls style="width: 100%;"></audio>
      <a id="view-audio-link" href="#" target="_blank" style="display:block; margin-top:5px; color:var(--primary); font-size:0.8rem; text-align:center;">Otwórz plik</a>
    </div>

    <div class="controls-panel">
      <button class="btn btn-secondary btn-small" onclick="toggleChords()">🎸 Akordy</button>
      <button class="btn btn-secondary btn-small" id="btn-scroll" onclick="toggleAutoScroll()">📜 Scroll</button>
    </div>
    <div id="view-chords" class="song-chords"></div>
    <div id="view-lyrics" class="song-lyrics"></div>
  </div>

  <!-- FORMULARZ -->
  <div id="view-form" class="hidden">
    <div class="nav-bar"><button class="btn btn-secondary btn-small" onclick="showView('view-home')">❌ Anuluj</button></div>
    <input type="hidden" id="form-id">
    <input type="text" id="form-title" class="input-field" placeholder="Tytuł *">
    <input type="text" id="form-category" class="input-field" placeholder="Kategoria">
    <input type="text" id="form-audio-url" class="input-field" placeholder="Link MP3/MP2">
    <textarea id="form-lyrics" class="input-field" placeholder="Tekst *"></textarea>
    <textarea id="form-chords" class="input-field" placeholder="Akordy"></textarea>
    <button class="btn btn-filled" onclick="saveSong()">💾 Zapisz</button>
    <button class="btn btn-danger hidden" id="btn-delete" onclick="deleteCurrentSong()">🗑️ Usuń</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const db = getFirestore(initializeApp({ projectId: "spiewnik-psie-pole" }));
  
  let songs = JSON.parse(localStorage.getItem('spiewnik_songs') || '[]');
  let archives = JSON.parse(localStorage.getItem('spiewnik_archives') || '[]');
  let repertuarIds = JSON.parse(localStorage.getItem('spiewnik_repertuar') || '[]');
  let activeCategory = 'Wszystkie';
  let previousView = 'view-home';

  window.showView = (v) => {
    document.querySelectorAll('.container > div').forEach(d => d.classList.add('hidden'));
    document.getElementById(v).classList.remove('hidden');
  };

  window.openSong = (id) => {
    const song = songs.find(s => s.id === id);
    if(!song) return;
    
    document.getElementById('view-title').innerText = song.title;
    document.getElementById('view-lyrics').innerText = song.lyrics;
    document.getElementById('view-chords').innerText = song.chords || "Brak akordów";
    
    const audioContainer = document.getElementById('view-audio-container');
    const audioPlayer = document.getElementById('view-audio-player');
    if(song.audioUrl) {
      audioPlayer.src = song.audioUrl;
      document.getElementById('view-audio-link').href = song.audioUrl;
      audioContainer.classList.remove('hidden');
    } else {
      audioPlayer.pause();
      audioContainer.classList.add('hidden');
    }
    
    showView('view-single');
  };

  // Reszta funkcji: toggleChords, saveSong, renderAll itp. są identyczne jak wcześniej.
  // Zostawiam miejsce na Twoje renderowanie list, które już miałeś.
  
  window.saveSong = async () => {
    const songData = {
      title: document.getElementById('form-title').value,
      audioUrl: document.getElementById('form-audio-url').value,
      lyrics: document.getElementById('form-lyrics').value,
      chords: document.getElementById('form-chords').value
    };
    // Zapis do bazy i lokalnie
    songs.push({id: Date.now().toString(), ...songData});
    localStorage.setItem('spiewnik_songs', JSON.stringify(songs));
    showView('view-home');
  };

  window.toggleChords = () => {
    const el = document.getElementById('view-chords');
    el.style.display = el.style.display === 'block' ? 'none' : 'block';
  };

  // Uruchom renderowanie po załadowaniu
  console.log("Aplikacja gotowa.");
</script>
</body>
</html>
