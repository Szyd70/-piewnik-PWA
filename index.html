<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Śpiewnik PWA</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 15px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="password"], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    .song-card { border: 1px solid #ccc; padding: 15px; margin-top: 15px; border-radius: 4px; }
  </style>
</head>
<body>

  <h1>Dodaj nową pieśń</h1>

  <form id="addSongForm">
    <div class="form-group">
      <label for="adminPin">PIN Administratora:</label>
      <input type="password" id="adminPin" required placeholder="Wprowadź PIN">
    </div>

    <div class="form-group">
      <label for="songTitle">Tytuł pieśni:</label>
      <input type="text" id="songTitle" required placeholder="np. Abba, Ojcze">
    </div>

    <div class="form-group">
      <label for="songContent">Tekst i akordy (Format Inline):</label>
      <textarea id="songContent" rows="8" required placeholder="1. Ty [fis]wybawiłeś nas..."></textarea>
    </div>

    <div class="form-group">
      <label for="audioFile">Plik MP3 (opcjonalnie):</label>
      <input type="file" id="audioFile" accept="audio/mp3,audio/mpeg">
    </div>

    <button type="submit" id="submitBtn">Zapisz pieśń</button>
  </form>

  <hr style="margin: 30px 0;">

  <h2>Lista pieśni</h2>
  <div id="songsList">Ladowanie...</div>

  <!-- SDK Firebase (v9 Compat - najwygodniejsze do szybkich PWA) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <script>
    // 1. Konfiguracja Firebase (podmień dane na swoje z konsoli Firebase)
    const firebaseConfig = {
      apiKey: "TWOJE_API_KEY",
      authDomain: "TWOJ_PROJECT_ID.firebaseapp.com",
      projectId: "TWOJ_PROJECT_ID",
      storageBucket: "TWOJ_PROJECT_ID.appspot.com",
      messagingSenderId: "TWOJ_SENDER_ID",
      appId: "TWOJ_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    // Stały PIN do weryfikacji po stronie klienta (zmień na swój)
    const CORRECT_PIN = "1234";

    // 2. Obsługa formularza dodawania pieśni
    const form = document.getElementById('addSongForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const inputPin = document.getElementById('adminPin').value;
      const title = document.getElementById('songTitle').value.trim();
      const content = document.getElementById('songContent').value.trim();
      const fileInput = document.getElementById('audioFile');
      const file = fileInput.files[0];

      // Weryfikacja PIN-u
      if (inputPin !== CORRECT_PIN) {
        alert("Błędny PIN! Brak uprawnień do dodawania utworu.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Zapisywanie...";

      try {
        let audioUrl = "";

        // Wgrywanie MP3 do Storage (jeśli wybrano plik)
        if (file) {
          const storageRef = storage.ref(`audio/${Date.now()}_${file.name}`);
          const uploadTask = await storageRef.put(file);
          audioUrl = await uploadTask.ref.getDownloadURL();
        }

        // Zapis rekordu do Firestore
        await db.collection("songs").add({
          title: title,
          content: content,
          audioUrl: audioUrl,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert("Pieśń dodana pomyślnie!");
        form.reset();
      } catch (error) {
        console.error("Błąd podczas zapisu:", error);
        alert("Wystąpił błąd: " + error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Zapisz pieśń";
      }
    });

    // 3. Wyświetlanie listy pieśni w czasie rzeczywistym
    db.collection("songs").orderBy("title").onSnapshot((snapshot) => {
      const container = document.getElementById('songsList');
      container.innerHTML = "";

      if (snapshot.empty) {
        container.innerHTML = "<p>Brak pieśni w bazie.</p>";
        return;
      }

      snapshot.forEach((doc) => {
        const song = doc.data();
        const card = document.createElement('div');
        card.className = "song-card";

        let html = `<h3>${song.title}</h3>`;
        html += `<pre style="white-space: pre-wrap;">${song.content}</pre>`;

        if (song.audioUrl) {
          html += `<audio controls style="width: 100%; margin-top: 10px;">
                    <source src="${song.audioUrl}" type="audio/mpeg">
                    Twoja przeglądarka nie wspiera odtwarzacza audio.
                   </audio>`;
        }

        card.innerHTML = html;
        container.appendChild(card);
      });
    });
  </script>
</body>
</html>
